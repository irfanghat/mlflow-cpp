apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlflow
  namespace: mlflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      containers:
        - name: mlflow

          image: ghcr.io/mlflow/mlflow:latest

          ports:
            - containerPort: 5000

          command:
            - mlflow

          args:
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////data/mlflow.db
            - --artifacts-destination=/data/artifacts

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data